appId: com.doujiao.app
productName: 豆角工具箱
executableName: doujiao
electronVersion: 33.4.11
copyright: Copyright © 2026 Doujiao Team
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
extraResources:
  - from: ../../registry
    to: registry
  - from: native/remote-input-helper/bin
    to: bin
  - from: native/dxgi-screen-capturer/bin
    to: bin
win:
  icon: build/icon.ico
  executableName: doujiao
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 豆角工具箱
  uninstallDisplayName: 豆角工具箱
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: "djtools-Setup-${version}.${ext}"
  include: build/installer.nsh

