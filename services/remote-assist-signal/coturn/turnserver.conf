# ==============================================================================
# Doujiao Remote Assistance - Coturn TURN/STUN Configuration
# ==============================================================================

# 基础监听端口
listening-port=3478
tls-listening-port=5349

# TURN Relay UDP 端口范围（用于穿透对称型 NAT 时的音视频媒体转发）
min-port=49152
max-port=65535

# 鉴权机制：使用长期凭据机制 (lt-cred-mech) 与时间戳 HMAC 共享密钥
lt-cred-mech
use-auth-secret
static-auth-secret=doujiao_remote_assist_turn_secret_2026_dev
realm=turn.doujiao.dev

# 消息指纹验证
fingerprint

# 禁用 CLI 运维端口以减少攻击面
no-cli

# 日志输出
verbose
log-file=stdout
